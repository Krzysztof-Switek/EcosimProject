# /etc/nginx/sites-available/ecosim  (ln -s into sites-enabled)
# Replace ecosim.example.org with the real name; certificates via certbot.

server {
    listen 80;
    server_name ecosim.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecosim.example.org;

    ssl_certificate     /etc/letsencrypt/live/ecosim.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecosim.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /srv/ecosim/app/frontend/dist;
    index index.html;

    # The single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The API, with /api stripped (as the dev server's proxy does).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Indexing a data source and Monte Carlo summaries take minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # Uploaded area files, map packs as .zip.
        client_max_body_size 200m;
        # Downloads (zip exports) stream straight through.
        proxy_buffering off;
    }
}

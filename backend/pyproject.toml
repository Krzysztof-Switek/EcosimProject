[project]
name = "ecosim-platform"
version = "0.1.0"
description = "Web platform for analysing, comparing and presenting EwE (Ecosim/Ecospace) model input and output."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
spatial = [
    "rasterio>=1.3",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
ecosim = "ecosim.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecosim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

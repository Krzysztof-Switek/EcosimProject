id: biomass_trend_compare
name: "Biomass trend comparison"
description: >
  Compares biomass trends of selected functional groups across scenarios,
  with optional smoothing and normalisation to the base year.
requires:
  domain: timeseries
  variables: [biomass]
  dims: [scenario, group]
params:
  - { key: smoothing, type: number, default: 3,     label: "Smoothing (years)" }
  - { key: relative,  type: bool,   default: false, label: "Relative to base year" }
entry: entry.R
